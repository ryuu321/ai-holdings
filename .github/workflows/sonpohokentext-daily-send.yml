name: sonpohokentext-daily-send

on:
  schedule:
    - cron: "30 2 * * 1-5"  # 平日 JST 11:30 (UTC 02:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (true/false)'
        default: 'true'
      limit:
        description: '送信件数上限'
        default: '30'

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Restore sent_log from Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.SONPOHOKENTEXT_SENT_LOG_GIST_ID }}
        run: |
          curl -sf -H "Authorization: token $GIST_TOKEN" \
            "https://api.github.com/gists/$GIST_ID" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          content = data['files'].get('sonpohokentext_sent_log.csv', {}).get('content', '')
          print(content, end='')
          " > saas-dev/projects/sonpohokentext/outreach/sent_log.csv || echo "Gist取得失敗"

      - name: Run GTM pipeline
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python saas-dev/projects/sonpohokentext/outreach/pipeline.py --limit ${{ inputs.limit || '30' }}

      - name: Send emails
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ARGS="--limit ${{ inputs.limit || '30' }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python saas-dev/projects/sonpohokentext/outreach/send_emails.py $ARGS

      - name: Upload updated sent_log to Gist
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.SONPOHOKENTEXT_SENT_LOG_GIST_ID }}
        run: |
          [ -f saas-dev/projects/sonpohokentext/outreach/sent_log.csv ] || exit 0
          python3 -c "
          import json
          content = open('saas-dev/projects/sonpohokentext/outreach/sent_log.csv', encoding='utf-8').read()
          print(json.dumps({'files': {'sonpohokentext_sent_log.csv': {'content': content}}}))
          " | curl -sf -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- \
            "https://api.github.com/gists/$GIST_ID"
