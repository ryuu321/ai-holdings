name: ghtext-check-replies

on:
  schedule:
    - cron: "0 1 * * 1-5"  # 平日 JST 10:00 (UTC 01:00)
  workflow_dispatch:

jobs:
  check-replies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Restore sent_log from Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GHTEXT_SENT_LOG_GIST_ID }}
        run: |
          curl -sf -H "Authorization: token $GIST_TOKEN" \
            "https://api.github.com/gists/$GIST_ID" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          content = data['files'].get('ghtext_sent_log.csv', {}).get('content', '')
          print(content, end='')
          " > saas-dev/projects/ghtext/outreach/sent_log.csv || echo "Gist取得失敗"

      - name: Check replies and notify
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python shared/gtm/outreach/check_replies.py --project ghtext --mark

      - name: Upload updated sent_log to Gist
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GHTEXT_SENT_LOG_GIST_ID }}
        run: |
          [ -f saas-dev/projects/ghtext/outreach/sent_log.csv ] || exit 0
          python3 -c "
          import json
          content = open('saas-dev/projects/ghtext/outreach/sent_log.csv', encoding='utf-8').read()
          print(json.dumps({'files': {'ghtext_sent_log.csv': {'content': content}}}))
          " | curl -sf -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- \
            "https://api.github.com/gists/$GIST_ID"
