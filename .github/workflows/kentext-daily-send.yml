name: kentext-daily-send

on:
  schedule:
    - cron: "30 3 * * 1-5"  # JST 12:30 平日
  workflow_dispatch:

jobs:
  daily-send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Restore sent_log from Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          GIST_ID=$(python3 -c "import json; print(json.load(open('shared/gtm/config/gist_ids.json')).get('kentext',''))")
          curl -sf -H "Authorization: token $GIST_TOKEN" \
            "https://api.github.com/gists/$GIST_ID" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          content = data['files'].get('kentext_sent_log.csv', {}).get('content', '')
          print(content, end='')
          " > saas-dev/projects/kensetsu/outreach/sent_log.csv || echo "Gist取得失敗: 新規作成"

      # Step 1: リード収集 (MLIT建設業DB + Brave API fallback)
      - name: Fetch leads
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python saas-dev/projects/kensetsu/outreach/fetch_mlit_kensetsu_leads.py --limit 100 --prefs 13,27,14,23 || true
          python saas-dev/projects/kensetsu/outreach/fetch_leads.py --limit 50 || true
          python shared/gtm/scripts/seed_leads_from_static.py --project kentext --limit 100

      # Step 2: ICPスコアリング (閾値70点)
      - name: Qualify leads
        run: |
          python shared/gtm/leads/qualify_leads.py \
            --project kentext \
            --input saas-dev/projects/kensetsu/outreach/leads.csv

      # Step 3: メール生成 (承認済みリードのみ)
      - name: Generate emails
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GEMINI_API_KEY_22: ${{ secrets.GEMINI_API_KEY_22 }}
          GEMINI_API_KEY_23: ${{ secrets.GEMINI_API_KEY_23 }}
          GEMINI_API_KEY_24: ${{ secrets.GEMINI_API_KEY_24 }}
          GEMINI_API_KEY_25: ${{ secrets.GEMINI_API_KEY_25 }}
          GEMINI_API_KEY_26: ${{ secrets.GEMINI_API_KEY_26 }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
        run: |
          python shared/gtm/outreach/generate_emails.py \
            --project kentext \
            --limit 50

      # Step 4: 送信 (30件/日・JST9-18のみ)
      - name: Send emails
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
        run: |
          python saas-dev/projects/kensetsu/outreach/send_emails.py \
            --limit 5

      - name: Upload sent_log to Gist
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          GIST_ID=$(python3 -c "import json; print(json.load(open('shared/gtm/config/gist_ids.json')).get('kentext',''))")
          [ -f saas-dev/projects/kensetsu/outreach/sent_log.csv ] || exit 0
          python3 -c "
          import json
          content = open('saas-dev/projects/kensetsu/outreach/sent_log.csv', encoding='utf-8').read()
          print(json.dumps({'files': {'kentext_sent_log.csv': {'content': content}}}))
          " | curl -sf -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- \
            "https://api.github.com/gists/$GIST_ID"
          echo "sent_log.csv をGistに保存"
