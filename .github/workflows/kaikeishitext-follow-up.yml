name: kaikeishitext-follow-up

on:
  schedule:
    - cron: "30 1 * * 2"  # 毎週火曜 JST 10:30 (UTC 01:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (true/false)'
        default: 'true'
      days:
        description: '何日以上前を対象にするか'
        default: '7'

jobs:
  follow-up:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Restore sent_log from Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          GIST_ID=$(python3 -c "import json; print(json.load(open('shared/gtm/config/gist_ids.json')).get('kaikeishitext',''))")
          curl -sf -H "Authorization: token $GIST_TOKEN" \
            "https://api.github.com/gists/$GIST_ID" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          content = data['files'].get('kaikeishitext_sent_log.csv', {}).get('content', '')
          print(content, end='')
          " > saas-dev/projects/kaikeishitext/outreach/sent_log.csv || echo "Gist取得失敗"

      - name: Send follow-up emails
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_ADDRESS: ${{ secrets.SENDER_ADDRESS }}
        run: |
          ARGS="--project kaikeishitext --days ${{ inputs.days || '7' }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python shared/gtm/outreach/follow_up.py $ARGS

      - name: Upload updated sent_log to Gist
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          GIST_ID=$(python3 -c "import json; print(json.load(open('shared/gtm/config/gist_ids.json')).get('kaikeishitext',''))")
          [ -f saas-dev/projects/kaikeishitext/outreach/sent_log.csv ] || exit 0
          python3 -c "
          import json
          content = open('saas-dev/projects/kaikeishitext/outreach/sent_log.csv', encoding='utf-8').read()
          print(json.dumps({'files': {'kaikeishitext_sent_log.csv': {'content': content}}}))
          " | curl -sf -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- \
            "https://api.github.com/gists/$GIST_ID"
